<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Garby — AI Content Authenticity Platform. Instantly detect AI-generated images and videos." />
    <meta name="theme-color" content="#1A1A2E" />

    <!-- Open Graph -->
    <meta property="og:title" content="Garby — AI Content Authenticity" />
    <meta property="og:description" content="Drawing a definitive line between content born from a human heart and content generated by bits." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://garby.app" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Garby — AI Content Authenticity</title>

        <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json"/>

    <!-- Theme colour (browser chrome, Android task switcher) -->
    <meta name="theme-color" content="#07081A"/>

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="Garby"/>
    <link rel="apple-touch-icon" href="/icons/icon-192.png"/>

    <!-- Splash screen colours for iOS -->
    <meta name="msapplication-TileColor" content="#07081A"/>
    <meta name="msapplication-TileImage" content="/icons/icon-144.png"/>

    <!-- Open Graph (WhatsApp/Twitter previews when sharing scan links) -->
    <meta property="og:title"       content="Garby — AI Content Detector"/>
    <meta property="og:description" content="Detect AI-generated images and videos instantly."/>
    <meta property="og:type"        content="website"/>
    <meta property="og:image"       content="/icons/icon-512.png"/>
    <meta name="twitter:card"       content="summary"/>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => console.log('[Garby] SW registered:', reg.scope))
            .catch(err => console.warn('[Garby] SW registration failed:', err))
        })
      }
    </script>
  </body>
</html>
