<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Garby — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #07081A; color: #F0F2FF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .container { max-width: 320px; }
    .icon { font-size: 48px; margin-bottom: 24px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    p  { color: #7F8C8D; font-size: 14px; line-height: 1.6; margin-bottom: 28px; }
    button {
      background: #00DFFF; color: #07081A; border: none; border-radius: 12px;
      padding: 14px 28px; font-size: 15px; font-weight: 600; cursor: pointer;
      width: 100%;
    }
    button:active { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>Garby needs an internet connection to scan images. Connect to Wi-Fi or mobile data and try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
