# ══════════════════════════════════════════════════════════════════════════════
# GARBY — Render Blueprint
# All three pieces — frontend, backend API, and the Python detection engine —
# run on Render. The frontend moved off Vercel (2026-09-01): no custom domain
# was ever DNS-wired to it, so this was a hosting-only cutover, not a DNS
# migration. Rationale: cross-provider (Vercel + Render) setups have
# repeatedly caused reachability problems on this user's projects; putting
# everything on one host has been the fix each time.
#
# How to deploy:
#   1. Push this file to `main`.
#   2. Render dashboard → New → Blueprint → select the garby repo.
#      Render reads this file and provisions the services below.
#   3. Every var marked `sync: false` is a secret — Render will prompt you
#      to fill it in per-service in the dashboard. Nothing secret lives here.
#   4. GARBY_ENGINE_URL and FRONTEND_URL are pre-wired to the deterministic
#      Render URLs of their respective services (https://<name>.onrender.com).
#      If a name is already taken and Render suffixes it, update the
#      dependent value(s) below to match and redeploy.
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ── Frontend — Static Site (React + Vite) ─────────────────────────────────────
  - type: web
    runtime: static
    name: garby-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true   # static assets are low-risk/cheap to rebuild — deploys on every push to main,
                        # unlike backend/engine below which are gated behind CI passing first.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
    envVars:
      - key: VITE_APP_NAME
        value: Garby
      # Deterministic Render URL of the backend service defined below —
      # see the note at the top of this file if the name gets suffixed.
      - key: VITE_API_URL
        value: https://garby-backend-8kv5.onrender.com
      # ── Secrets — set real values in the Render dashboard, never here ──────
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  # ── Detection Engine — Python / FastAPI (5-layer model + trained classifier) ──
  - type: web
    name: garby-detection-engine
    env: python
    plan: standard          # numpy + scipy + scikit-learn + the 9MB model need
                             # more headroom than the 512MB `starter` plan gives.
                             # Drop to `starter` only if you've confirmed it fits.
    region: oregon
    rootDir: detection_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: false   # deploys are triggered by CI (deploy hook) only after lint/test/build pass — see .github/workflows/ci-cd.yml
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # ── Backend API — Node / Express ─────────────────────────────────────────────
  - type: web
    name: garby-backend
    env: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: false   # deploys are triggered by CI (deploy hook) only after lint/test/build pass — see .github/workflows/ci-cd.yml
    envVars:
      - key: NODE_VERSION
        value: 20.11.1   # match CI's NODE_VERSION (ci-cd.yml) to avoid toolchain drift
      - key: NPM_CONFIG_PRODUCTION
        value: "false"   # NODE_ENV=production below makes npm skip devDependencies
                          # (typescript, @types/*) at build time unless this is set —
                          # this is what actually broke the last two deploys.
      - key: NODE_ENV
        value: production
      - key: ENGINE_TIMEOUT
        value: "90000"
      # Deterministic Render URL of the engine service defined above —
      # see the note at the top of this file if the name gets suffixed.
      - key: GARBY_ENGINE_URL
        value: https://garby-detection-engine.onrender.com

      # ── Secrets — set real values in the Render dashboard, never here ──────
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: HIVE_API_KEY
        sync: false
      - key: SIGHTENGINE_USER
        sync: false
      - key: SIGHTENGINE_SECRET
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_BUCKET
        sync: false
      - key: AWS_REGION
        sync: false
      - key: CDN_BASE_URL
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # Deterministic Render URL of the frontend service defined above —
      # see the note at the top of this file if the name gets suffixed.
      - key: FRONTEND_URL
        value: https://garby-frontend.onrender.com
